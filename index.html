    <script>
        // ----------------------------------------------------
        // 1. 유틸리티 함수 및 로컬스토리지
        // ----------------------------------------------------
        function escapeHTML(str) { return String(str).replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)); }
        function debounce(func, wait) { let timeout; return function(...args) { clearTimeout(timeout); timeout = setTimeout(() => func.apply(this, args), wait); }; }
        function hashCode(str) { let hash = 0; for (let i = 0; i < str.length; i++) hash = ((hash << 5) - hash) + str.charCodeAt(i); return hash; }
        
        const CHO_LIST = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
        function getChosung(str) {
            let result = "";
            for (let i = 0; i < str.length; i++) {
                const code = str.charCodeAt(i) - 44032;
                if (code > -1 && code < 11172) result += CHO_LIST[Math.floor(code / 588)];
                else result += str.charAt(i);
            }
            return result;
        }

        function highlightText(text, query) {
            if (!query || !text) return escapeHTML(text);
            const safeText = escapeHTML(text); const safeQuery = escapeHTML(query);
            try { const regex = new RegExp(`(${safeQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi'); return safeText.replace(regex, '<span class="bg-amber-200 dark:bg-amber-800 text-slate-900 dark:text-white px-0.5 rounded">$1</span>'); }
            catch(e) { return safeText; }
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            const bgColors = { success: 'bg-slate-900 dark:bg-white text-white dark:text-slate-900', error: 'bg-rose-600 text-white', info: 'bg-blue-600 text-white' };
            toast.className = `${bgColors[type] || bgColors.success} px-4 py-3 rounded-2xl shadow-xl text-xs font-bold pointer-events-auto transform translate-y-2 opacity-0 transition-all duration-300 flex items-center gap-2`;
            toast.innerHTML = `<i class="fa-solid fa-${type==='error'?'circle-exclamation':'circle-check'}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => { toast.classList.add('translate-y-2', 'opacity-0'); setTimeout(() => toast.remove(), 300); }, 2500);
        }

        const Storage = {
            get(key, defaultValue) {
                try {
                    const vItem = localStorage.getItem('eb_1000_v5_' + key) || localStorage.getItem('eb_1000_v4_' + key) || localStorage.getItem('eb_1000_v3_' + key);
                    if (vItem) return JSON.parse(vItem); return defaultValue;
                } catch (e) { return defaultValue; }
            },
            set(key, value) { try { localStorage.setItem('eb_1000_v5_' + key, JSON.stringify(value)); } catch(e) {} }
        };

            if(timerSeconds === 0) display.classList.add('timer-blink'); else display.classList.remove('timer-blink');
        }

        function clearSearch() { const input = document.getElementById('main-search-input'); if(input) { input.value = ''; handleSearch(); document.getElementById('autocomplete-box')?.classList.add('hidden'); } }

        function updateAutocomplete(query) {
            const acBox = document.getElementById('autocomplete-box');
            if(!acBox || !query) { acBox?.classList.add('hidden'); return; }
            const qLower = query.toLowerCase();
            const matches = DB.filter(item => item._searchText.includes(qLower) || item._chosung.includes(query)).slice(0, 8);
            selectedAutocompleteIdx = -1;
            if (matches.length === 0) { acBox.classList.add('hidden'); return; }
            acBox.innerHTML = matches.map((item, idx) => `<div onmousedown="selectAutocomplete('${item.keyword}')" class="ac-item px-4 py-2.5 hover:bg-blue-50 dark:hover:bg-slate-700 text-xs font-medium cursor-pointer flex justify-between text-slate-800 dark:text-slate-200" data-index="${idx}"><span>${highlightText(item.keyword, query)}</span><span class="text-slate-400">${item.category}</span></div>`).join('');
            acBox.classList.remove('hidden');
        }

        function handleAcKeydown(e) {
            const acBox = document.getElementById('autocomplete-box');
            const items = acBox ? acBox.querySelectorAll('.ac-item') : [];
            if(e.key === 'ArrowDown') { e.preventDefault(); selectedAutocompleteIdx = Math.min(selectedAutocompleteIdx + 1, items.length - 1); updateAcHighlight(items); }
            else if(e.key === 'ArrowUp') { e.preventDefault(); selectedAutocompleteIdx = Math.max(selectedAutocompleteIdx - 1, 0); updateAcHighlight(items); }
            else if(e.key === 'Enter') { if(items.length > 0 && selectedAutocompleteIdx >= 0 && selectedAutocompleteIdx < items.length) { e.preventDefault(); items[selectedAutocompleteIdx].dispatchEvent(new Event('mousedown')); } else { if(acBox) acBox.classList.add('hidden'); } }
            else if(e.key === 'Escape') { if(acBox) acBox.classList.add('hidden'); }
        }

        function updateAcHighlight(items) { items.forEach((item, idx) => { if(idx === selectedAutocompleteIdx) item.classList.add('bg-blue-50', 'dark:bg-slate-700'); else item.classList.remove('bg-blue-50', 'dark:bg-slate-700'); }); }
        function selectAutocomplete(keyword) { const input = document.getElementById('main-search-input'); if(input) input.value = keyword; document.getElementById('autocomplete-box')?.classList.add('hidden'); handleSearch(); }

        function handleSearch() {
            const input = document.getElementById('main-search-input');
            const query = input ? input.value.trim() : '';
            const sort = document.getElementById('sort-select') ? document.getElementById('sort-select').value : 'accuracy';
            const clearBtn = document.getElementById('clear-search-btn');
            if (clearBtn) { if (query) clearBtn.classList.remove('hidden'); else clearBtn.classList.add('hidden'); }
            
            // [오류 수정 반영] null 저장 원천 차단
            if(query.length > 1 && query !== 'null') { 
                let recents = Storage.get('recent_searches', []).filter(q => q && String(q).trim() !== 'null'); 
                recents = [query, ...recents.filter(q => q !== query)].slice(0, 20); 
                Storage.set('recent_searches', recents); 
            }

            let scoredResults = DB.map(item => {
                if (currentCategoryFilter !== '전체' && item.category !== currentCategoryFilter) return { item, score: -1 };
                if (!query) return { item, score: 0 };
                let score = 0; const qLower = query.toLowerCase(); const kwLower = item._keywordLower;
                if (kwLower === qLower) score += 200; if (kwLower.startsWith(qLower)) score += 100; if (kwLower.includes(qLower)) score += 70;
                if (item._chosung.includes(query)) score += 60; if (item.aliases.some(a => a.toLowerCase().includes(qLower))) score += 50;
                if (item.tags.some(t => t.toLowerCase().includes(qLower))) score += 40; if (item.simple.toLowerCase().includes(qLower)) score += 30;
                if (item.description.toLowerCase().includes(qLower)) score += 15; if (item.situations.some(s => s.toLowerCase().includes(qLower))) score += 10;
                return { item, score: score > 0 ? score : -1 };
            }).filter(res => res.score >= 0);
            
            if(sort === 'accuracy') scoredResults.sort((a, b) => b.score - a.score);
            else scoredResults.sort((a, b) => a.item.keyword.localeCompare(b.item.keyword));
            
            const results = scoredResults.map(res => res.item);
            const countEl = document.getElementById('result-count'); if(countEl) countEl.innerText = `검색 결과: ${results.length}개`;
            const grid = document.getElementById('search-results-grid'); const loadMoreBtn = document.getElementById('load-more-container');
            if(!grid) return;

            if(results.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-16 text-center bg-white dark:bg-slate-800 rounded-3xl border border-slate-200/80 dark:border-slate-700"><h3 class="text-base font-bold text-slate-800 dark:text-slate-200">찾는 교직어가 없어요</h3></div>`;
                loadMoreBtn?.classList.add('hidden'); return;
            }

            const bookmarks = Storage.get('bookmarks', []);
            grid.innerHTML = results.slice(0, searchDisplayLimit).map(item => `
                <div onclick="openDetail(${item.id})" class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200/80 dark:border-slate-700 shadow-sm hover:border-blue-500 dark:hover:border-blue-500 transition cursor-pointer flex flex-col justify-between group">
                    <div>
                        <div class="flex justify-between mb-2"><span class="text-xs font-semibold px-2 py-1 bg-slate-100 dark:bg-slate-700 rounded-lg text-slate-600 dark:text-slate-300">${item.category}</span><button onclick="event.stopPropagation(); toggleBookmark(${item.id})" class="text-slate-400 hover:text-amber-500 dark:hover:text-amber-400"><i class="fa-${bookmarks.includes(item.id) ? 'solid text-amber-500 dark:text-amber-400' : 'regular'} fa-bookmark"></i></button></div>
                        <h3 class="font-bold group-hover:text-blue-600 dark:group-hover:text-blue-400 mb-1 text-slate-800 dark:text-white">${highlightText(item.keyword, query)}</h3>
                        <p class="text-xs text-blue-600 dark:text-blue-400 mb-2">${highlightText(item.simple, query)}</p>
                        <p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-2">${highlightText(item.description, query)}</p>
                    </div>
                </div>
            `).join('');
            loadMoreBtn?.classList.toggle('hidden', results.length <= searchDisplayLimit);
        }

                renderQuizActive(container);

        function startQuiz(count) {
            const shuffled = [...DB].sort(() => 0.5 - Math.random());
            quizState = { active: true, count: count, index: 0, score: 0, items: shuffled.slice(0, count), answers: [], level: "" };
            router.render();
        }

        function renderQuizActive(container) {
            if (quizState.index >= quizState.items.length) { renderQuizResult(container); return; }
            const q = quizState.items[quizState.index];
            const quizQuestionText = q.quizQuestion || `다음 설명에 해당하는 교직 용어는 무엇인가요?\n\n"${q.description}"`;
            
            let wrongOptionsData = DB.filter(d => d.id !== q.id && d.category === q.category).sort(() => 0.5 - Math.random());
            if (wrongOptionsData.length < 3) {
                const add = DB.filter(d => d.id !== q.id && d.category !== q.category).sort(() => 0.5 - Math.random());
                wrongOptionsData = [...wrongOptionsData, ...add];
            }
            const options = [...wrongOptionsData.slice(0, 3).map(d => d.keyword), q.keyword].sort(() => 0.5 - Math.random());

            container.innerHTML = `

        function answerQuiz(selected, correct) {
            const isCorrect = selected === correct;
            if (isCorrect) quizState.score += Math.round(100 / quizState.count);
            quizState.answers.push({ q: quizState.items[quizState.index].keyword, isCorrect });
            if (!isCorrect) {
                let wrongs = Storage.get('quiz_wrongs', []);
                wrongs.push(quizState.items[quizState.index].id);
                Storage.set('quiz_wrongs', [...new Set(wrongs)]);

            quizState.index++; router.render();
        }

        function renderQuizResult(container) {
            quizState.active = false;
            let level = "Lv.1 교직 탐험가";

            else if (quizState.score >= 70) level = "Lv.4 교직 고수";
            else if (quizState.score >= 50) level = "Lv.3 업무 해결사";
            else if (quizState.score >= 30) level = "Lv.2 학교 적응 완료";
            quizState.level = level;

            let hist = Storage.get('quiz_history', []);
            hist.push({ date: new Date().toLocaleDateString(), score: quizState.score, level });

                        <h3 class="text-base font-bold text-slate-900 dark:text-white flex items-center gap-2"><i class="fa-solid fa-circle-half-stroke text-purple-500"></i> 화면 테마 설정</h3>
                        <div class="flex gap-3">
                            <button onclick="setThemeMode('light')" class="px-4 py-2.5 rounded-xl text-xs font-bold transition ${currentThemeMode==='light'?'bg-blue-600 text-white shadow-md':'bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600'}">라이트 모드</button>
                            <button onclick="setThemeMode('dark')" class="px-4 py-2.5 rounded-xl text-xs font-bold transition ${currentThemeMode==='dark'?'bg-blue-600 text-white shadow-md':'bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600'}">다크 모드</button>
                            <button onclick="setThemeMode('system')" class="px-4 py-2.5 rounded-xl text-xs font-bold transition ${currentThemeMode==='system'?'bg-blue-600 text-white shadow-md':'bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600'}">시스템 설정 따르기</button>
                        </div>
                    </div>
                    
                    <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-sm border border-slate-200/80 dark:border-slate-700 space-y-4">
                        <h3 class="text-base font-bold text-slate-900 dark:text-white flex items-center gap-2"><i class="fa-solid fa-database text-blue-500 dark:text-blue-400"></i> 데이터 백업 및 복원</h3>
                        <div class="flex flex-wrap gap-3">
                            <button onclick="backupData()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-sm transition shadow-sm"><i class="fa-solid fa-download mr-1"></i> 내 데이터 백업</button>
                            <label class="px-5 py-2.5 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 font-bold rounded-xl text-sm cursor-pointer hover:bg-slate-200 dark:hover:bg-slate-600 transition shadow-sm"><i class="fa-solid fa-upload mr-1"></i> 백업 파일 불러오기<input type="file" accept=".json" onchange="restoreData(event)" class="hidden"></label>
                        </div>
                    </div>
                    
                    <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-sm border border-slate-200/80 dark:border-slate-700 flex flex-col md:flex-row gap-4 md:items-center justify-between">
                        <div><h4 class="font-bold text-sm text-slate-900 dark:text-white mb-1">개인 기록 전체 초기화</h4><p class="text-xs text-slate-500 dark:text-slate-400">로컬스토리지에 저장된 즐겨찾기, 진행률 등 모든 기록을 삭제합니다.</p></div>
                        <button onclick="if(confirm('정말로 모든 기록을 지우시겠습니까? 복구할 수 없습니다.')) { localStorage.clear(); window.location.reload(); }" class="px-5 py-2.5 bg-rose-50 dark:bg-rose-900/40 text-rose-600 dark:text-rose-400 font-bold rounded-xl text-sm hover:bg-rose-100 dark:hover:bg-rose-900/60 transition">전체 초기화</button>
                    </div>
                </div>
            `;
        }

        // --- 공통 및 시스템 기능 ---
        function setThemeMode(mode) { Storage.set('theme_mode', mode); applyThemeMode(); showToast(`테마 변경 완료`, 'info'); router.render(); }
        function toggleQuickDarkMode() { setThemeMode(document.documentElement.classList.contains('dark') ? 'light' : 'dark'); }
        function applyThemeMode() {
            const mode = Storage.get('theme_mode', 'light');
            if(mode==='dark' || (mode==='system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
        }
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if(Storage.get('theme_mode')==='system') applyThemeMode(); });

        function backupData() {
            const data = { bookmarks: Storage.get('bookmarks', []), recent_searches: Storage.get('recent_searches', []), learned_cards: Storage.get('learned_cards', []), quiz_history: Storage.get('quiz_history', []), board_tasks: Storage.get('board_tasks', {}), class_names: Storage.get('class_names', '') };
            const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], {type:'application/json'})); a.download = `baekseo_backup_${new Date().toISOString().slice(0,10)}.json`; a.click(); showToast('백업 완료', 'success');
        }
        function restoreData(e) {
            const f = e.target.files[0]; if(!f) return; const r = new FileReader();
            r.onload = e => { 
                try { 
                    const d = JSON.parse(e.target.result); 
                    if(d.bookmarks) Storage.set('bookmarks', d.bookmarks); 
                    if(d.recent_searches) Storage.set('recent_searches', d.recent_searches); 
                    if(d.board_tasks) Storage.set('board_tasks', d.board_tasks); 
                    if(d.class_names) Storage.set('class_names', d.class_names); 
                    showToast('복원 성공! 1초 후 새로고침됩니다.'); setTimeout(()=>window.location.reload(), 1000); 
                } catch(err) { showToast('오류 발생', 'error'); } 
            };
            r.readAsText(f);
        }

        function openMobileMenu() { const m = document.getElementById('mobile-menu-modal'); if(m) m.classList.remove('hidden'); }
        function closeMobileMenu() { const m = document.getElementById('mobile-menu-modal'); if(m) m.classList.add('hidden'); }

        // 안정적인 초기화 시작점
        if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', () => { applyThemeMode(); router.init(); }); }
        else { applyThemeMode(); router.init(); }

    </script>
</body>
</html>
