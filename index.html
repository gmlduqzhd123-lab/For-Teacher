                    const v2Item = localStorage.getItem('eb_1000_v2_' + key);

                    }
                    return defaultValue;

            let result = "";
            for (let i = 0; i < str.length; i++) {
                const code = str.charCodeAt(i) - 44032;
                if (code > -1 && code < 11172) {
                    result += CHO_LIST[Math.floor(code / 588)];

            );
        }

        function highlightText(text, query) {
            if (!query || !text) return escapeHTML(text);

            try {

                    <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200/80 dark:border-slate-700 shadow-sm space-y-4 relative">
                        <div class="relative">
                            <input type="text" id="main-search-input" value="${initialQuery}" placeholder="용어, 생기부, 학폭, 나이스, ㅈㅎㅅ..." class="w-full pl-12 pr-10 py-3.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 font-medium focus:outline-none focus:ring-2 focus:ring-blue-500 transition" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="autocomplete-box">
                            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <button onclick="clearSearch()" id="clear-search-btn" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 hidden" aria-label="검색어 지우기">
                                <i class="fa-solid fa-circle-xmark"></i>
                            </button>
                            <div id="autocomplete-box" class="absolute left-0 right-0 top-full mt-2 bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-700 hidden z-30 overflow-hidden"></div>
                        </div>

                        <div class="flex gap-2 overflow-x-auto pb-2 hide-scrollbar" id="category-filter-bar">
                            <button onclick="filterCategory('전체')" class="cat-btn px-3 py-1.5 rounded-xl text-xs font-semibold shrink-0 transition bg-blue-600 text-white" data-cat="전체">전체 (${DB.length})</button>
                            ${CATEGORIES.map(cat => `<button onclick="filterCategory('${cat}')" class="cat-btn px-3 py-1.5 rounded-xl text-xs font-semibold shrink-0 transition bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200" data-cat="${cat}">${cat}</button>`).join('')}
                        </div>
                    </div>

                    <div class="flex items-center justify-between text-xs text-slate-500 dark:text-slate-400 px-1">
                        <span id="result-count">검색 결과: ${DB.length}개</span>
                        <div class="flex items-center gap-2">
                            <button onclick="triggerRandomExplore()" class="px-3 py-1 rounded-lg bg-blue-50 dark:bg-blue-900/40 text-blue-600 dark:text-blue-300 font-semibold hover:bg-blue-100 transition flex items-center gap-1.5">
                                <i class="fa-solid fa-dice"></i> 랜덤 키워드
                            </button>
                            <select id="sort-select" onchange="handleSearch()" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-2.5 py-1 text-xs focus:outline-none">
                                <option value="accuracy">관련도순</option>
                                <option value="name">가나다순</option>
                            </select>
                        </div>
                    </div>

                    <div id="search-results-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
                    <div id="load-more-container" class="text-center pt-4 hidden">
                        <button onclick="loadMoreResults()" class="px-6 py-2.5 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 font-bold text-xs rounded-xl transition">더 보기 (60개 추가)</button>
                    </div>
                </div>
            `;

            const input = document.getElementById('main-search-input');
            input.addEventListener('input', debounce(() => {
                handleSearch();
                updateAutocomplete(input.value.trim());
            }, 100));

            input.addEventListener('keydown', (e) => {
                const acBox = document.getElementById('autocomplete-box');
                const items = acBox ? acBox.querySelectorAll('.ac-item') : [];
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    selectedAutocompleteIdx = Math.min(selectedAutocompleteIdx + 1, items.length - 1);
                    updateAutocompleteHighlight(items);
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    selectedAutocompleteIdx = Math.max(selectedAutocompleteIdx - 1, 0);
                    updateAutocompleteHighlight(items);
                } else if (e.key === 'Enter') {
                    if (items.length > 0 && selectedAutocompleteIdx >= 0 && selectedAutocompleteIdx < items.length) {
                        e.preventDefault();
                        items[selectedAutocompleteIdx].click();
                    } else {
                        if (acBox) acBox.classList.add('hidden');
                    }
                } else if (e.key === 'Escape') {
                    if (acBox) acBox.classList.add('hidden');
                }
            });

            handleSearch();
        }

        function filterCategory(cat) {
            currentCategoryFilter = cat;
            searchDisplayLimit = 60;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.getAttribute('data-cat') === cat) {
                    btn.className = "cat-btn px-3 py-1.5 rounded-xl text-xs font-semibold shrink-0 transition bg-blue-600 text-white";
                } else {
                    btn.className = "cat-btn px-3 py-1.5 rounded-xl text-xs font-semibold shrink-0 transition bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200";
                }
            });
            handleSearch();
        }

        function clearSearch() {
            const input = document.getElementById('main-search-input');
            if (input) {
                input.value = '';
                handleSearch();
                const ac = document.getElementById('autocomplete-box');
                if (ac) ac.classList.add('hidden');
            }
        }

        function updateAutocomplete(query) {
            const acBox = document.getElementById('autocomplete-box');
            if (!acBox || !query || query.length < 1) {
                if (acBox) acBox.classList.add('hidden');
                return;
            }

            const qLower = query.toLowerCase();
            const matches = DB.filter(item => item._searchText.includes(qLower) || item._chosung.includes(query)).slice(0, 8);
            selectedAutocompleteIdx = -1;

            if (matches.length === 0) {
                acBox.classList.add('hidden');
                return;
            }

            acBox.innerHTML = matches.map((item, idx) => `
                <div onmousedown="selectAutocomplete('${item.keyword}')" class="ac-item px-4 py-2.5 hover:bg-blue-50 dark:hover:bg-slate-700 text-xs font-medium cursor-pointer flex items-center justify-between" data-index="${idx}">
                    <span>${highlightText(item.keyword, query)}</span>
                    <span class="text-slate-400">${item.category}</span>
                </div>
            `).join('');
            acBox.classList.remove('hidden');
        }

        function updateAutocompleteHighlight(items) {
            items.forEach((item, idx) => {
                if (idx === selectedAutocompleteIdx) {
                    item.classList.add('bg-blue-50', 'dark:bg-slate-700');
                } else {
                    item.classList.remove('bg-blue-50', 'dark:bg-slate-700');
                }
            });
        }

        function selectAutocomplete(keyword) {
            const input = document.getElementById('main-search-input');
            if (input) input.value = keyword;
            const acBox = document.getElementById('autocomplete-box');
            if (acBox) acBox.classList.add('hidden');
            handleSearch();
        }

        function handleSearch() {
            const input = document.getElementById('main-search-input');
            const query = input ? input.value.trim() : '';
            const sort = document.getElementById('sort-select') ? document.getElementById('sort-select').value : 'accuracy';
            const clearBtn = document.getElementById('clear-search-btn');
            
            if (clearBtn) {
                if (query) clearBtn.classList.remove('hidden');
                else clearBtn.classList.add('hidden');
            }

            if (query && query.length > 1) {
                let recents = Storage.get('recent_searches', []);
                recents = [query, ...recents.filter(q => q !== query)].slice(0, 20);
                Storage.set('recent_searches', recents);
            }

            let scoredResults = DB.map(item => {
                const matchCat = currentCategoryFilter === '전체' || item.category === currentCategoryFilter;
                if (!matchCat) return { item, score: -1 };

                if (!query) return { item, score: 0 };

                let score = 0;
                const qLower = query.toLowerCase();
                const kwLower = item._keywordLower;

                if (kwLower === qLower) score += 200;
                if (kwLower.startsWith(qLower)) score += 100;
                if (kwLower.includes(qLower)) score += 70;
                if (item._chosung.includes(query)) score += 60;
                if (item.aliases && item.aliases.some(a => a.toLowerCase().includes(qLower))) score += 50;
                if (item.tags && item.tags.some(t => t.toLowerCase().includes(qLower))) score += 40;
                if (item.simple && item.simple.toLowerCase().includes(qLower)) score += 30;
                if (item.description && item.description.toLowerCase().includes(qLower)) score += 15;
                if (item.situations && item.situations.some(s => s.toLowerCase().includes(qLower))) score += 10;

                return { item, score: score > 0 ? score : -1 };
            }).filter(res => res.score >= 0);

            if (sort === 'accuracy') {
                scoredResults.sort((a, b) => b.score - a.score);
            } else {
                scoredResults.sort((a, b) => a.item.keyword.localeCompare(b.item.keyword));
            }

            const results = scoredResults.map(res => res.item);

            const countEl = document.getElementById('result-count');
            if (countEl) countEl.innerText = `검색 결과: ${results.length}개`;

            const grid = document.getElementById('search-results-grid');
            const loadMoreBtn = document.getElementById('load-more-container');
            if (!grid) return;

            if (results.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-16 text-center bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700">
                        <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-blue-50 dark:bg-blue-900/40 text-blue-500 flex items-center justify-center text-2xl"><i class="fa-solid fa-search"></i></div>
                        <h3 class="text-base font-bold text-slate-700 dark:text-slate-200 mb-1">찾는 교직어가 없어요</h3>
                        <p class="text-xs text-slate-400">다른 표현으로 검색하거나 카테고리를 탐색해보세요.</p>
                    </div>
                `;
                if (loadMoreBtn) loadMoreBtn.classList.add('hidden');
                return;
            }

            const bookmarks = Storage.get('bookmarks', []);
            const visibleResults = results.slice(0, searchDisplayLimit);

            grid.innerHTML = visibleResults.map(item => {
                const isBookmarked = bookmarks.includes(item.id);
                return `
                    <div onclick="openDetail(${item.id})" class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200/80 dark:border-slate-700 hover:border-blue-500 hover:shadow-md transition cursor-pointer flex flex-col justify-between group">
                        <div>
                            <div class="flex items-center justify-between mb-2">
                                <span class="text-xs font-semibold px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300">${item.category}</span>
                                <button onclick="event.stopPropagation(); toggleBookmark(${item.id})" class="text-slate-400 hover:text-amber-500 transition" aria-label="즐겨찾기">
                                    <i class="fa-${isBookmarked ? 'solid text-amber-500' : 'regular'} fa-bookmark"></i>
                                </button>
                            </div>
                            <h3 class="text-base font-bold text-slate-800 dark:text-white group-hover:text-blue-600 transition mb-1">${highlightText(item.keyword, query)}</h3>
                            <p class="text-xs font-medium text-blue-600 dark:text-blue-400 mb-2">${highlightText(item.simple, query)}</p>
                            <p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-2">${highlightText(item.description, query)}</p>
                        </div>
                        <div class="mt-4 pt-3 border-t border-slate-100 dark:border-slate-700 flex items-center justify-between text-xs text-slate-400">
                            <span>난이도 Lv.${item.difficulty}</span>
                            <span class="group-hover:translate-x-1 transition">상세보기 →</span>
                        </div>
                    </div>
                `;
            }).join('');

            if (loadMoreBtn) {
                if (results.length > searchDisplayLimit) loadMoreBtn.classList.remove('hidden');
                else loadMoreBtn.classList.add('hidden');
            }
        }

        function loadMoreResults() {
            searchDisplayLimit += 60;
            handleSearch();
        }

        function triggerRandomExplore() {
            const randomItem = DB[Math.floor(Math.random() * DB.length)];
            openDetail(randomItem.id);
        }

        let lastFocusedElement = null;

        function openDetail(id, pushHash = true) {
            const item = DB.find(d => d.id === id);
            if (!item) return;

            lastFocusedElement = document.activeElement;
            const modal = document.getElementById('detail-modal');
            const content = document.getElementById('modal-content');
            const bookmarks = Storage.get('bookmarks', []);
            const isBookmarked = bookmarks.includes(item.id);

            let recentViews = Storage.get('recent_views', []);
            recentViews = [item.id, ...recentViews.filter(i => i !== item.id)].slice(0, 15);
            Storage.set('recent_views', recentViews);

            if (pushHash) {
                window.location.hash = `#keyword=${encodeURIComponent(item.keyword)}`;
            }

            content.innerHTML = `
                <div class="flex items-start justify-between mb-4 pb-4 border-b border-slate-100 dark:border-slate-700">
                    <div>
                        <span class="text-xs font-bold px-3 py-1 rounded-lg bg-blue-50 dark:bg-blue-900/40 text-blue-600 dark:text-blue-400 mb-2 inline-block">${item.category}</span>
                        <h2 id="modal-title" class="text-2xl font-extrabold text-slate-900 dark:text-white">${item.keyword}</h2>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="shareKeyword('${item.keyword}')" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:text-blue-500 transition" aria-label="공유"><i class="fa-solid fa-share-nodes text-lg"></i></button>
                        <button onclick="toggleBookmark(${item.id}); openDetail(${item.id}, false)" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:text-amber-500 transition" aria-label="즐겨찾기"><i class="fa-${isBookmarked ? 'solid text-amber-500' : 'regular'} fa-bookmark text-lg"></i></button>
                        <button onclick="closeModal(true)" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 transition" aria-label="닫기"><i class="fa-solid fa-xmark text-lg"></i></button>
                    </div>
                </div>

                <div class="space-y-6 text-sm">
                    <div class="p-4 rounded-2xl bg-blue-50/60 dark:bg-slate-900/60 border border-blue-100 dark:border-slate-700">
                        <span class="text-xs font-bold text-blue-600 dark:text-blue-400 block mb-1">💡 쉽게 말하면</span>
                        <p class="font-semibold text-slate-800 dark:text-slate-200">${item.simple}</p>
                    </div>

                    <div>
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">📖 기본 설명</span>
                        <p class="text-slate-700 dark:text-slate-300 leading-relaxed">${item.description}</p>
                    </div>

                    ${item.situations && item.situations.length > 0 ? `
                        <div>
                            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">🏫 학교에서는 언제 쓰나요?</span>
                            <div class="space-y-2">
                                ${item.situations.map(sit => `<div class="flex items-center gap-2.5 px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-900 text-slate-700 dark:text-slate-300 font-medium"><i class="fa-solid fa-circle-check text-blue-500 text-xs"></i> ${sit}</div>`).join('')}
                            </div>
                        </div>
                    ` : ''}

                    ${item.related && item.related.length > 0 ? `
                        <div>
                            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">🔗 함께 알아두면 좋은 교직어</span>
                            <div class="flex flex-wrap gap-2">
                                ${item.related.map(rel => {
                                    const found = DB.find(d => d.keyword === rel);
                                    return found ? `<button onclick="openDetail(${found.id})" class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-700 text-xs font-semibold text-slate-700 dark:text-slate-300 hover:bg-blue-50 hover:text-blue-600 transition">${rel}</button>` : '';
                                }).join('')}
                            </div>
                        </div>
                    ` : ''}

                    ${item.tags && item.tags.length > 0 ? `
                        <div>
                            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">🏷 관련 태그</span>
                            <div class="flex flex-wrap gap-1.5">
                                ${item.tags.map(t => `<span class="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-700 text-xs font-medium text-slate-600 dark:text-slate-300">#${t}</span>`).join('')}
                            </div>
                        </div>
                    ` : ''}

                    <div class="p-3 rounded-xl bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800/40 text-xs text-amber-800 dark:text-amber-300 flex items-center justify-between">
                        <div><i class="fa-solid fa-triangle-exclamation mr-1"></i> 제도·지침은 시기 및 시도교육청에 따라 달라질 수 있으므로 최신 공식 지침을 확인하세요.</div>
                        <button onclick="router.navigate('search', '${item.keyword}')" class="font-bold underline shrink-0 ml-2">탐험 시작</button>
                    </div>
                </div>
            `;

            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            window.addEventListener('keydown', handleModalKeyDown);
        }

        function handleModalKeyDown(e) {
            if (e.key === 'Escape') closeModal(true);
        }

        function closeModal(popHash = true) {
            const modal = document.getElementById('detail-modal');
            if (modal) modal.classList.add('hidden');
            document.body.style.overflow = 'auto';
            window.removeEventListener('keydown', handleModalKeyDown);
            if (lastFocusedElement) lastFocusedElement.focus();
            if (popHash && window.location.hash.includes('keyword=')) {
                window.location.hash = `#view=${router.current}`;
            }
        }

        function shareKeyword(keyword) {
            const shareUrl = window.location.href.split('#')[0] + `#keyword=${encodeURIComponent(keyword)}`;
            if (navigator.share) {
                navigator.share({ title: `교직백서 1000 - ${keyword}`, url: shareUrl }).catch(() => {});
            } else {
                navigator.clipboard.writeText(shareUrl).then(() => {
                    showToast('링크가 클립보드에 복사되었습니다.', 'success');
                });
            }
        }

        function toggleBookmark(id) {
            let bookmarks = Storage.get('bookmarks', []);
            if (bookmarks.includes(id)) {
                bookmarks = bookmarks.filter(b => b !== id);
                showToast('즐겨찾기에서 해제되었습니다.', 'info');
            } else {
                bookmarks.push(id);
                showToast('즐겨찾기에 저장되었습니다.', 'success');
            }
            Storage.set('bookmarks', bookmarks);
            renderApp();
        }

        function renderSituations(container) {
            container.innerHTML = `
                <div class="space-y-6">
                    <div>
                        <h2 class="text-2xl font-bold tracking-tight mb-1">이럴 땐 어떻게?</h2>
                        <p class="text-sm text-slate-500 dark:text-slate-400">학교 현장의 당황스러운 순간, ${SITUATIONS.length}가지 실전 대응 가이드를 확인하세요.</p>
                    </div>

                    <div class="relative max-w-md">
                        <input type="text" id="situation-search-input" placeholder="상황 검색 (예: 다침, 학부모, 전학, 예산...)" class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                    </div>

                    <div id="situations-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

                    <div class="p-4 rounded-2xl bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800/40 text-xs text-amber-800 dark:text-amber-300">
                        <i class="fa-solid fa-triangle-exclamation mr-1"></i> 실제 업무 처리 시 해당 연도 교육부·시도교육청·교육지원청·학교 지침을 함께 확인하세요.
                    </div>
                </div>
            `;

            const sitInput = document.getElementById('situation-search-input');
            if (sitInput) {
                sitInput.addEventListener('input', debounce(() => {
                    updateSituationsGrid(sitInput.value.trim());
                }, 150));
            }
            updateSituationsGrid('');
        }

        function updateSituationsGrid(filterQuery) {
            const grid = document.getElementById('situations-grid');
            if (!grid) return;

            const filteredSituations = SITUATIONS.filter(sit => {
                if (!filterQuery) return true;
                const q = filterQuery.toLowerCase();
                return sit.title.toLowerCase().includes(q) || sit.summary.toLowerCase().includes(q) || sit.category.toLowerCase().includes(q);
            });

            if (filteredSituations.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-12 text-center bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700">
                        <p class="text-xs text-slate-400">검색 결과가 없습니다.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filteredSituations.map(sit => `
                <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200/80 dark:border-slate-700 shadow-sm flex flex-col justify-between">
                    <div>
                        <span class="text-xs font-bold px-3 py-1 rounded-lg bg-amber-50 dark:bg-amber-900/40 text-amber-600 dark:text-amber-400 mb-3 inline-block">${sit.category}</span>
                        <h3 class="text-lg font-bold text-slate-900 dark:text-white mb-2">${sit.title}</h3>
                        <p class="text-xs text-slate-500 mb-4">${sit.summary}</p>
                        <div class="space-y-2 mb-4">
                            ${sit.steps.map((st, idx) => `
                                <div class="flex items-start gap-2.5 text-xs text-slate-600 dark:text-slate-300">
                                    <span class="w-5 h-5 rounded-full bg-blue-100 dark:bg-blue-900/40 text-blue-600 dark:text-blue-400 flex items-center justify-center font-bold shrink-0">${idx + 1}</span>
                                    <span class="pt-0.5">${st}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <div class="pt-4 border-t border-slate-100 dark:border-slate-700 flex items-center justify-between">
                        <button onclick="searchKeywordByName('${sit.relatedKeywords[0]}')" class="text-xs font-bold text-blue-600 dark:text-blue-400 hover:underline">관련 키워드(${sit.relatedKeywords[0]}) 보기 →</button>
                        <span class="text-xs text-slate-400">실전 대응 가이드</span>
                    </div>
                </div>
            `).join('');
        }

        function searchKeywordByName(kw) {
            const found = DB.find(d => d.keyword.includes(kw));
            if (found) openDetail(found.id);
            else router.navigate('search', kw);
        }

        function renderNavigator(container) {
            container.innerHTML = `
                <div class="space-y-6">
                    <div>
                        <h2 class="text-2xl font-bold tracking-tight mb-1">교직 내비게이터</h2>

        function startQuiz(count) {
            const shuffled = [...DB].sort(() => 0.5 - Math.random());
            quizState = {
                active: true,
                count: count,
                index: 0,
                score: 0,
                items: shuffled.slice(0, count),
                answers: []
            };
            renderQuiz(document.getElementById('app-view'));
        }

        function renderQuizActive(container) {
            if (quizState.index >= quizState.items.length) {
                renderQuizResult(container);
                return;
            }

            const q = quizState.items[quizState.index];
            const wrongOptions = DB.filter(d => d.id !== q.id && d.category === q.category).sort(() => 0.5 - Math.random()).slice(0, 3).map(d => d.keyword);
            const options = [...wrongOptions, q.keyword].sort(() => 0.5 - Math.random());

            container.innerHTML = `
                <div class="space-y-6 max-w-2xl mx-auto">
                    <div class="flex items-center justify-between text-xs font-bold text-slate-400">
                        <span>QUESTION ${quizState.index + 1} / ${quizState.count}</span>
                        <span>카테고리: ${q.category}</span>

                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function answerQuiz(selected, correct) {
            const isCorrect = selected === correct;
            if (isCorrect) quizState.score += Math.round(100 / quizState.count);
            quizState.answers.push({ q: quizState.items[quizState.index].keyword, selected, correct, isCorrect });
            if (!isCorrect) {
                let wrongs = Storage.get('quiz_wrongs', []);
                wrongs.push(quizState.items[quizState.index].id);
                Storage.set('quiz_wrongs', [...new Set(wrongs)]);
            }
            quizState.index++;
            renderQuiz(document.getElementById('app-view'));
        }

            let level = "Lv.1 교직 탐험가";

            else if (quizState.score >= 50) level = "Lv.3 업무 해결사";
            else if (quizState.score >= 30) level = "Lv.2 학교 적응 완료";

                        <p class="text-sm text-slate-500 dark:text-slate-400">즐겨찾기, 최근 본 기록 및 데이터 백업을 관리합니다.</p>
                    </div>

                    <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl border border-slate-200/80 dark:border-slate-700 shadow-sm space-y-4">
                        <h3 class="text-base font-bold text-slate-900 dark:text-white flex items-center gap-2">
                            <i class="fa-solid fa-bookmark text-amber-500"></i> 즐겨찾기한 교직어 (${bookmarkedItems.length}개)
                        </h3>
                        ${bookmarkedItems.length > 0 ? `
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                ${bookmarkedItems.map(item => `
                                    <div onclick="openDetail(${item.id})" class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 hover:border-blue-500 cursor-pointer transition flex items-center justify-between">
                                        <div>
                                            <span class="text-xs font-semibold text-blue-600 dark:text-blue-400">${item.category}</span>
                                            <h4 class="font-bold text-slate-800 dark:text-white text-sm">${item.keyword}</h4>
                                        </div>
                                        <button onclick="event.stopPropagation(); toggleBookmark(${item.id}); renderMyBox(document.getElementById('app-view'))" class="text-slate-400 hover:text-rose-500" aria-label="삭제">
                                            <i class="fa-solid fa-trash text-xs"></i>
                                        </button>
                                    </div>
                                `).join('')}
                            </div>
                        ` : `<p class="text-xs text-slate-400 py-4 text-center">즐겨찾기한 교직어가 없습니다.</p>`}
                    </div>

                    <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl border border-slate-200/80 dark:border-slate-700 shadow-sm space-y-4">
                        <h3 class="text-base font-bold text-slate-900 dark:text-white flex items-center gap-2">
                            <i class="fa-solid fa-circle-half-stroke text-purple-500"></i> 화면 테마 설정
                        </h3>
                        <div class="flex gap-3">
                            <button onclick="setThemeMode('light')" class="px-4 py-2 rounded-xl text-xs font-semibold ${currentThemeMode==='light'?'bg-blue-600 text-white':'bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300'}">라이트 모드</button>
                            <button onclick="setThemeMode('dark')" class="px-4 py-2 rounded-xl text-xs font-semibold ${currentThemeMode==='dark'?'bg-blue-600 text-white':'bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300'}">다크 모드</button>
                            <button onclick="setThemeMode('system')" class="px-4 py-2 rounded-xl text-xs font-semibold ${currentThemeMode==='system'?'bg-blue-600 text-white':'bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300'}">시스템 설정 따르기</button>
                        </div>
                    </div>

                    <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl border border-slate-200/80 dark:border-slate-700 shadow-sm space-y-4">
                        <h3 class="text-base font-bold text-slate-900 dark:text-white flex items-center gap-2">
                            <i class="fa-solid fa-database text-blue-500"></i> 데이터 백업 및 복원
                        </h3>
                        <div class="flex flex-wrap gap-3">
                            <button onclick="backupData()" class="px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-xs transition">내 데이터 백업 (JSON 다운로드)</button>
                            <label class="px-4 py-2.5 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 font-semibold rounded-xl text-xs cursor-pointer transition">
                                백업 파일 불러오기 <input type="file" accept=".json" onchange="restoreData(event)" class="hidden">
                            </label>
                        </div>
                    </div>

                    <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl border border-slate-200/80 dark:border-slate-700 shadow-sm flex items-center justify-between">
                        <div>
                            <h4 class="font-bold text-slate-800 dark:text-white text-sm">개인 기록 초기화</h4>
                            <p class="text-xs text-slate-400">로컬스토리지에 저장된 북마크, 체크리스트, 학습 기록을 초기화합니다.</p>
                        </div>
                        <button onclick="if(confirm('정말 모든 개인 기록을 초기화하시겠습니까?')) { localStorage.clear(); window.location.reload(); }" class="px-4 py-2 bg-rose-50 dark:bg-rose-900/40 text-rose-600 dark:text-rose-400 rounded-xl text-xs font-semibold hover:bg-rose-100 transition">초기화</button>
                    </div>
                </div>
            `;
        }

        function setThemeMode(mode) {
            Storage.set('theme_mode', mode);
            applyThemeMode();
            showToast(`테마가 [${mode === 'light' ? '라이트' : mode === 'dark' ? '다크' : '시스템'}] 설정으로 변경되었습니다.`, 'info');
            renderMyBox(document.getElementById('app-view'));
        }

        function applyThemeMode() {
            const mode = Storage.get('theme_mode', 'light');
            const html = document.documentElement;
            if (mode === 'dark') {
                html.classList.add('dark');
            } else if (mode === 'light') {
                html.classList.remove('dark');
            } else {
                if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    html.classList.add('dark');
                } else {
                    html.classList.remove('dark');
                }
            }
        }

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
            if (Storage.get('theme_mode', 'light') === 'system') {
                applyThemeMode();
            }
        });

        function toggleQuickDarkMode() {
            const isDark = document.documentElement.classList.contains('dark');
            setThemeMode(isDark ? 'light' : 'dark');
        }

        function backupData() {
            const data = {
                bookmarks: Storage.get('bookmarks', []),
                recent_searches: Storage.get('recent_searches', []),
                learned_cards: Storage.get('learned_cards', []),
                quiz_history: Storage.get('quiz_history', [])
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `gyojik_baekseo_backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            showToast('백업 파일이 생성 및 다운로드되었습니다.', 'success');
        }

        function restoreData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.bookmarks) Storage.set('bookmarks', data.bookmarks);
                    if (data.recent_searches) Storage.set('recent_searches', data.recent_searches);
                    if (data.learned_cards) Storage.set('learned_cards', data.learned_cards);
                    if (data.quiz_history) Storage.set('quiz_history', data.quiz_history);
                    showToast('데이터가 성공적으로 복원되었습니다.', 'success');
                    setTimeout(() => window.location.reload(), 1000);
                } catch (err) {
                    showToast('유효하지 않은 백업 파일입니다.', 'error');
                }
            };
            reader.readAsText(file);
        }

        function openMobileMenu() {
            const m = document.getElementById('mobile-menu-modal');
            if (m) m.classList.remove('hidden');
        }

        function closeMobileMenu() {
            const m = document.getElementById('mobile-menu-modal');
            if (m) m.classList.add('hidden');
        }

        function debounce(func, wait) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }

        // [오류 수정 반영] DOM 로딩 상태를 체크하여 이미 로드된 경우 즉시 안전하게 앱을 초기화하도록 개선
        if (document.readyState === 'loading') {
            window.addEventListener('DOMContentLoaded', () => {
                applyThemeMode();
                router.init();
            });
        } else {
            applyThemeMode();
            router.init();
        }
    </script>
</body>
</html>
