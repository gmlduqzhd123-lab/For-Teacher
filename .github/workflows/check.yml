name: 자동 점검

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: 데이터·문법·저장 규칙 점검
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # r0a-contract.mjs reads the baseline commit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/static-check.mjs
      - run: node scripts/usability-check.mjs
      - run: node scripts/r0a-contract.mjs verify

  smoke:
    name: 모든 화면 열어 보기
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/smoke-test.mjs
