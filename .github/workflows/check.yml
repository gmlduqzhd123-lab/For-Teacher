name: 자동 점검

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: 데이터·문법·저장 규칙 점검
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # r0a-contract.mjs reads the baseline commit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/static-check.mjs
      - run: node scripts/usability-check.mjs
      - run: node scripts/r0a-contract.mjs verify
      # 화면 꾸미기 파일(css/tailwind.css)이 지금 코드로 다시 만든 결과와 같은지 확인 (새 클래스를 쓰고 다시 만들지 않으면 스타일이 빠짐)
      - name: 화면 꾸미기 파일 최신 여부
        run: |
          npx --yes tailwindcss@3.4.17 -c tailwind.config.cjs -i tailwind.input.css -o "$RUNNER_TEMP/tailwind.css" --minify
          if ! cmp -s css/tailwind.css "$RUNNER_TEMP/tailwind.css"; then
            echo "::error file=css/tailwind.css::css/tailwind.css가 지금 코드와 맞지 않습니다. 새 Tailwind 클래스를 썼다면 'npx tailwindcss@3.4.17 -c tailwind.config.cjs -i tailwind.input.css -o css/tailwind.css --minify'로 다시 만들어 함께 커밋하세요."
            exit 1
          fi

  smoke:
    name: 모든 화면 열어 보기
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 러너에 이미 설치된 Chrome을 써서 브라우저·시스템 패키지 내려받기(가끔 멈춤)를 피함
      - run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - run: node scripts/smoke-test.mjs
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
